name: Build APK from zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (just to store artifacts)
        uses: actions/checkout@v4

      - name: Download project zip from repository root
        run: |
          ls -la
          test -f SMPGuide.zip || (echo "Put SMPGuide.zip in repo root" && exit 1)

      - name: Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip -q SMPGuide.zip -d project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build Debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
